name: Edge case CI
on:
  pull_request:
    paths:
      - '.github/workflows/edge-cases.yml'
      - 'src/edge-*'
  workflow_dispatch:
    inputs:
      mode:
        description: Controlled result
        type: choice
        options: [success, failure, flaky]
        default: success
      delay:
        description: Delay in seconds
        type: choice
        options: ['0', '60', '120']
        default: '0'
permissions:
  contents: read
jobs:
  stable-edge:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'This successful job should survive a partial rerun.'
  flaky-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Controlled result and attempt
        env:
          MODE: ${{ inputs.mode || 'success' }}
          DELAY: ${{ inputs.delay || '0' }}
        run: |
          sleep "$DELAY"
          if [ "$MODE" = failure ]; then exit 1; fi
          if [ "$MODE" = flaky ] && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then exit 1; fi
